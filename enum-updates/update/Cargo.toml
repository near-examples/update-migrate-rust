[package]
name = "enums-update"
version = "1.0.0"
authors = ["Near Inc <hello@near.org>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1" }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
near-sandbox = "0.3"
near-api = "0.8.6"
cargo-near-build = "0.11.5"
testresult = "0.4.1"
tokio = { version = "1.48.0", features = ["full"] }
serde_json = "1"
